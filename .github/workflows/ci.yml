name: CI

# Chạy khi push lên main (sau khi merge) và khi có pull request vào main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      # Một hệ điều hành đỏ vẫn chạy hết hệ điều hành kia, để biết lỗi có phụ thuộc OS không.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Mặc định 360 phút. Job đầy đủ mất khoảng 1 phút (Windows ~61 s ở run 41882547009); vòng lặp đồng bộ
    # không cấp phát thì --test-timeout không bắt được, giới hạn này chặn job treo nhiều giờ.
    timeout-minutes: 15
    steps:
      # https://github.com/actions/checkout/releases (v7.0.1, 2026-07-20)
      - uses: actions/checkout@v7

      # Ghim SHA: bản v6 mới nhất đã phát hành ít nhất 14 ngày (2026-09-05), bản đầu hỗ trợ pnpm 12.
      # https://github.com/pnpm/action-setup/releases/tag/v6.1.0
      # version bắt buộc vì package.json chưa có packageManager (xem docs/backlog.md, nhóm Công cụ).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1

      # https://github.com/actions/setup-node/releases (v7.1.0, 2026-10-08)
      # node-version-file đọc engines.node; cache: pnpm cần pnpm đã cài ở bước trên.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: node .claude/skills/check/scripts/check-encoding.mjs --all
